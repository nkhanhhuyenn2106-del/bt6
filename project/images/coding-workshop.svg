<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="540" height="280">
  <defs>
    <linearGradient id="workshopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#workshopBg)" rx="10"/>
  <!-- People and laptops silhouette -->
  <circle cx="150" cy="90" r="30" fill="#ecfdf5"/>
  <path d="M110 160 C110 125, 190 125, 190 160 Z" fill="#d1fae5"/>
  
  <circle cx="270" cy="80" r="35" fill="#ffffff"/>
  <path d="M220 160 C220 120, 320 120, 320 160 Z" fill="#e0e7ff"/>
  
  <circle cx="390" cy="90" r="30" fill="#ecfdf5"/>
  <path d="M350 160 C350 125, 430 125, 430 160 Z" fill="#d1fae5"/>
  
  <!-- Desk & Computers -->
  <rect x="70" y="160" width="400" height="20" rx="4" fill="#064e3b"/>
  <!-- Laptop 1 -->
  <rect x="125" y="130" width="50" height="30" rx="3" fill="#1e293b"/>
  <!-- Laptop 2 (Big monitor) -->
  <rect x="235" y="115" width="70" height="45" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="270" y="142" font-family="'Courier New', monospace" font-size="12" fill="#38bdf8" font-weight="bold" text-anchor="middle">&lt;CSS3/&gt;</text>
  <!-- Laptop 3 -->
  <rect x="365" y="130" width="50" height="30" rx="3" fill="#1e293b"/>
  
  <!-- Banner Title -->
  <rect x="110" y="200" width="320" height="50" rx="8" fill="#065f46"/>
  <text x="270" y="232" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Workshop: Xây Dựng Web Chuẩn Ngữ Nghĩa</text>
</svg>
