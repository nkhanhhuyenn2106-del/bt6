<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#heroBg)" rx="12"/>
  
  <!-- Decorative Grid & Circles -->
  <circle cx="80" cy="50" r="100" fill="#ffffff" opacity="0.04"/>
  <circle cx="700" cy="220" r="140" fill="#ffffff" opacity="0.05"/>
  
  <!-- Left Side: Code Editor Mockup -->
  <g transform="translate(40, 35)">
    <rect width="360" height="210" rx="8" fill="url(#cardBg)" stroke="#334155" stroke-width="2"/>
    <!-- Window controls -->
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#10b981"/>
    <!-- Tab title -->
    <text x="75" y="24" font-family="'Courier New', monospace" font-size="12" fill="#94a3b8">index.html &amp; style.css</text>
    <line x1="0" y1="36" x2="360" y2="36" stroke="#334155" stroke-width="1.5"/>
    <!-- Code Lines -->
    <text x="20" y="65" font-family="'Courier New', monospace" font-size="13" fill="#60a5fa">&lt;header&gt;</text>
    <text x="40" y="90" font-family="'Courier New', monospace" font-size="13" fill="#fcd34d">&lt;h1&gt;CodeBreakers Club&lt;/h1&gt;</text>
    <text x="20" y="115" font-family="'Courier New', monospace" font-size="13" fill="#60a5fa">&lt;/header&gt;</text>
    <text x="20" y="145" font-family="'Courier New', monospace" font-size="13" fill="#34d399">/* 1 shared stylesheet */</text>
    <text x="20" y="170" font-family="'Courier New', monospace" font-size="13" fill="#cbd5e1">nav a.active { color: #fff; }</text>
    <text x="20" y="195" font-family="'Courier New', monospace" font-size="13" fill="#cbd5e1">.event-card { border-left: 4px; }</text>
  </g>

  <!-- Right Side: Graphic & Text -->
  <g transform="translate(440, 70)">
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Web Authoring</text>
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#93c5fd">&amp; Web Management</text>
    <text x="0" y="105" font-family="Arial, sans-serif" font-size="15" fill="#e0e7ff">Khám phá sức mạnh của HTML5 ngữ nghĩa,</text>
    <text x="0" y="128" font-family="Arial, sans-serif" font-size="15" fill="#e0e7ff">CSS3 hiện đại và kiến trúc website đa trang.</text>
    <rect x="0" y="145" width="160" height="34" rx="6" fill="#38bdf8"/>
    <text x="80" y="167" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Tham gia ngay ➔</text>
  </g>
</svg>
